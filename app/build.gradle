plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.20'


}
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 35
//    buildToolsVersion = '30.0.1'
    namespace 'com.app.kickboxing'
    defaultConfig {
        applicationId "com.app.kickboxing"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 3126
        versionName "3.1.26"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
        compose true
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            jniLibs.srcDirs = ['libs']
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.7"
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'com.android.support:design:28.0.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    // implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'com.android.support:design:28.0.0' // Replace with AndroidX if necessary
    // Check the Kotlin version for compatibility with your setup
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.22')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.test:core:1.4.0'
    implementation 'androidx.test:runner:1.4.0'
    implementation 'androidx.test:rules:1.4.0'
    implementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Other dependencies
    implementation "io.github.chaosleung:pinview:1.4.4"
    implementation 'com.github.HanHuoBin:BaseDialog:1.2.0'
    implementation 'com.tencent.bugly:crashreport:latest.release'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'

    //EventBus
    implementation("org.greenrobot:eventbus:3.3.1")

    //sdp - size unit scales with the screen size
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'androidx.activity:activity:1.8.0'


    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.compose.runtime:runtime-livedata:1.8.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.05.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation("io.coil-kt:coil-compose:2.4.0")

  //  implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.navigation:navigation-compose:2.8.4"
    implementation("androidx.core:core-ktx:1.9.0")

    //manage and update System UI bar colors
    implementation 'com.google.accompanist:accompanist-systemuicontroller:0.32.0'

    //==== Kotlinx Serialization library ====
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "androidx.compose.animation:animation:1.6.1"

    implementation("io.coil-kt:coil-compose:2.5.0")
    implementation "androidx.compose.material3:material3:1.1.0-alpha08"
    implementation "androidx.compose.ui:ui:1.4.0"
    implementation "androidx.compose.material3:material3-window-size-class:1.1.0-alpha08"
    implementation "com.github.tapadoo:alerter:7.2.4"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    //==================== Dependency Injection ====================
//    def hilt_version = "2.50"
//    implementation "com.google.dagger:hilt-android:$hilt_version"
//    ksp "com.google.dagger:hilt-compiler:$hilt_version"
//    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'


    def okhttp_version = '4.12.0'
    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.14'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.auth0.android:jwtdecode:1.3.0'
    //==================== Logging ====================
    implementation "com.jakewharton.timber:timber:5.0.1"

    //WearOS integration
    implementation("com.google.android.gms:play-services-wearable:18.1.0")
    implementation 'com.google.firebase:firebase-messaging:23.4.0'
    implementation "com.google.android.gms:play-services-location:21.3.0"

}
