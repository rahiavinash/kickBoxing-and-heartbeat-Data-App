buildscript {
    ext.kotlin_version = '1.9.21' // Or latest stable
    ext {
        hilt_version = '2.50'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()

    }
    dependencies {
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "com.android.tools.build:gradle:8.3.0" // Or latest
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        jcenter()  // Optional, for legacy dependencies
        maven { url 'https://jitpack.io' }  // If you are using dependencies from JitPack
    }
}
